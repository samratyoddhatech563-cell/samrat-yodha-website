<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2463">
<title>सम्राट योद्धा फाउंडेशन ऐप</title>
<meta name="description" content="सम्राट योद्धा फाउंडेशन का आधिकारिक मोबाइल ऐप (APK) डाउनलोड करें।">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE  occasion: an official, proud, trustworthy download page for a youth & education foundation
   IDEA   the foundation's own app store listing: founder up top, app tile, one big install button
   PICTURE the founder photo, full bleed, with the yellow "संस्थापक" tag and navy name plate
   COLOUR white ground, deep navy #0B2463 + royal blue #1A3FA8, brand gold #F5C518 as the accent
   TYPE   Mukta 800 for titles, Mukta 500-700 for text (Devanagari + Latin)
   LAYOUT one phone screen: header, photo (flexes), 3 quick buttons, app card, version line, button */
:root{color-scheme:light;--bg:#fff;--ink:#0B1F4D;--navy:#0B2463;--blue:#1A3FA8;--blue2:#2753CF;--gold:#F5C518;--gold2:#FFD84A;--line:#E2E7F1;--soft:#F3F6FC;--mute:#4A5878}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Mukta","Noto Sans Devanagari","Nirmala UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,a{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{text-decoration:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:10px}
.app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
.top{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:#fff;border-bottom:1px solid var(--line);z-index:2}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--navy)}
.icon-btn:hover{background:var(--soft)}
.icon-btn svg{width:26px;height:26px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:48px;height:48px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--line)}
.brand b{font-weight:800;font-size:22px;line-height:1.02;letter-spacing:-.01em;color:var(--navy)}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;padding-bottom:max(14px,env(safe-area-inset-bottom))}
.hero{position:relative;flex:1 1 0;min-height:200px;max-height:400px;background:#1d3a2a;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,rgba(8,22,60,.55))}
.plate{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:1;display:flex;flex-direction:column;align-items:center;width:max-content;max-width:calc(100% - 32px)}
.tag{background:var(--gold);color:var(--navy);font-weight:800;font-size:15px;line-height:1;padding:6px 16px 5px;border-radius:9px 9px 0 0;box-shadow:0 -1px 0 rgba(0,0,0,.05)}
.name{background:var(--navy);color:#fff;font-weight:800;font-size:20px;line-height:1.15;padding:8px 18px;border-radius:12px;border:2px solid rgba(255,255,255,.9);text-align:center;box-shadow:0 6px 18px rgba(5,15,45,.35)}
.name small{font-weight:600;font-size:14px;opacity:.9;margin-left:4px;white-space:nowrap}
.body{flex:none;display:flex;flex-direction:column;gap:12px;padding:14px 16px 0}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.q{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:80px;padding:10px 4px 8px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 2px 6px rgba(11,36,99,.07);color:var(--navy);font-weight:700;font-size:15px;line-height:1.15;text-align:center;transition:transform .15s,box-shadow .15s}
.q svg{width:30px;height:30px;color:var(--blue)}
.q:hover{box-shadow:0 6px 14px rgba(11,36,99,.12)}
.q:active{transform:scale(.97)}
.card{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:linear-gradient(135deg,#0E2D7A,var(--navy) 60%,#081A4A);color:#fff;box-shadow:0 8px 20px rgba(11,36,99,.25)}
.app-ico{flex:none;width:64px;height:64px;border-radius:16px;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 3px 8px rgba(0,0,0,.25)}
.app-ico img{width:54px;height:54px;border-radius:50%}
.card-t{display:flex;flex-direction:column;gap:2px;flex:1}
.card-t b{font-weight:800;font-size:19px;line-height:1.1}
.card-t span{font-weight:600;font-size:15px;line-height:1.2;opacity:.92}
.pill{align-self:flex-start;margin-top:6px;display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:var(--navy);font-weight:800;font-size:14px;line-height:1;padding:7px 14px 6px;border-radius:99px}
.pill svg{width:15px;height:15px}
.pill:hover{background:var(--gold2)}
.meta{display:flex;justify-content:center;align-items:center;gap:12px;font-weight:700;font-size:17px;color:var(--ink);white-space:nowrap}
.meta i{width:1.5px;height:16px;background:#9AA6C2}
.dl{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:10px 16px;border-radius:14px;background:linear-gradient(180deg,var(--blue2),var(--blue));color:#fff;font-weight:800;font-size:19px;line-height:1.1;box-shadow:0 8px 18px rgba(26,63,168,.35),inset 0 -3px 0 rgba(0,0,0,.18);transition:transform .15s}
.dl svg{width:24px;height:24px;flex:none}
.dl:active{transform:scale(.98)}
.dl::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-18deg);animation:sheen 3.6s ease-in-out 1.2s infinite}
@keyframes sheen{0%{left:-60%}45%,100%{left:130%}}
.help{align-self:center;display:inline-flex;align-items:center;min-height:36px;font-weight:600;font-size:15px;color:var(--blue);text-decoration:underline;text-underline-offset:3px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(6,16,44,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:460px;max-height:86%;display:flex;flex-direction:column;background:#fff;border-radius:20px 20px 0 0;transform:translate(-50%,105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);z-index:21;box-shadow:0 -8px 30px rgba(6,16,44,.25)}
.sheet.on{transform:translate(-50%,0)}
.sh-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 12px 8px 20px;border-bottom:1px solid var(--line)}
.sh-head h2{margin:0;font-weight:800;font-size:22px;line-height:1.1;color:var(--navy)}
.sh-body{overflow-y:auto;padding:14px 20px max(20px,env(safe-area-inset-bottom))}
.menu{list-style:none;margin:0;padding:0}
.menu button{width:100%;display:flex;align-items:center;gap:14px;min-height:54px;padding:6px 4px;border-bottom:1px solid var(--line);font-weight:700;font-size:17px;color:var(--ink);text-align:left}
.menu svg{width:24px;height:24px;color:var(--blue);flex:none}
.foot{margin:16px 0 0;font-size:14px;color:var(--mute);text-align:center}
.slogan{margin:14px 0 0;font-weight:700;font-size:15px;color:var(--navy);text-align:center}
.feats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.feat{padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--soft)}
.feat svg{width:28px;height:28px;color:var(--blue)}
.feat b{display:block;margin-top:4px;font-weight:800;font-size:16px;line-height:1.2;color:var(--navy)}
.feat p{margin:3px 0 0;font-size:14px;line-height:1.35;color:var(--mute)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:800;font-size:17px}
.steps p{margin:5px 0 0;font-size:16px;line-height:1.4}
.steps p b{color:var(--navy)}
.note{margin:14px 0 0;padding:10px 12px;border-radius:12px;background:#FFF8D6;border:1px solid #F3DE7A;font-size:14px;line-height:1.4;color:#5A4600}
.sh-body .dl{margin-top:16px}
.ver{list-style:none;margin:0;padding:0}
.ver li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ver b{flex:none;font-weight:800;color:var(--navy);white-space:nowrap}
.ver span{font-size:15px;color:var(--mute)}
.badge{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;background:var(--gold);color:var(--navy);font-size:12px;font-weight:800}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px;padding:8px 0;font-weight:700;font-size:16px;line-height:1.3;color:var(--ink)}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";flex:none;font-size:24px;line-height:1;color:var(--blue)}
details[open] summary::after{content:"–"}
details p{margin:0 0 12px;font-size:15px;line-height:1.45;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,20px);width:max-content;max-width:calc(100% - 32px);padding:12px 16px;border-radius:12px;background:#0B1F4D;color:#fff;font-weight:600;font-size:15px;line-height:1.35;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-height:640px){.q{min-height:68px;font-size:14px}.q svg{width:24px;height:24px}.card{padding:10px 12px}.app-ico{width:54px;height:54px}.app-ico img{width:46px;height:46px}.body{gap:10px;padding-top:10px}.dl{min-height:52px}}
@media (min-width:600px){
body{background:radial-gradient(1200px 600px at 50% -10%,#1E47B8,transparent),#0B2463;display:grid;place-items:center;padding:24px}
.app{width:100%;height:min(100%,880px);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08)}
.scrim,.sheet{position:absolute}
.toast{position:absolute}
}
@media (prefers-reduced-motion:reduce){.dl::after{animation:none;display:none}.sheet,.scrim,.toast,.q{transition:none}}
</style>
</head>

<template id="t-faq" data-title="सहायता (FAQ)">
  <details><summary>डाउनलोड के बाद फ़ाइल कहाँ मिलेगी..?</summary><p>फ़ोन के File Manager में <b>Downloads</b> फ़ोल्डर में, या Chrome के मेन्यू में “Downloads” खोलकर।</p></details>
  <details><summary>‘फ़ाइल हानिकारक हो सकती है’ चेतावनी क्यों आती है..?</summary><p>Play Store के बाहर से डाउनलोड होने वाली हर APK फ़ाइल पर Chrome यह चेतावनी दिखाता है। इस आधिकारिक पेज से डाउनलोड की गई फ़ाइल के लिए “फिर भी डाउनलोड करें” चुनें।</p></details>
  <details><summary>‘Unknown Sources’ कैसे Allow करें..?</summary><p>फ़ाइल खोलने पर फ़ोन खुद Settings का रास्ता दिखाता है। “इस स्रोत से अनुमति दें” (Allow from this source) चालू करें और वापस आकर Install दबाएँ।</p></details>
  <details><summary>क्या यह iPhone पर चलेगा..?</summary><p>नहीं। APK फ़ाइल केवल Android फ़ोन के लिए है।</p></details>
  <details><summary>ऐप इंस्टॉल नहीं हो रहा, क्या करें..?</summary><p>फ़ोन में खाली जगह (स्टोरेज) जाँचें और देखें कि फ़ाइल पूरी डाउनलोड हुई है। फिर भी न हो तो फ़ाइल हटाकर दोबारा डाउनलोड करें।</p></details>
</template>

<script>
{
  /* ▼▼ यहाँ APK फ़ाइल का लिंक, वर्ज़न और साइज़ बदलें ▼▼ */
  const APP = {
    apk: "samrat-yodha-foundation-v1.0.apk",
    version: "v1.0",
    size: "48 MB"
  };
  /* ▲▲ बस इतना ही बदलना है ▲▲ */

  const $ = (s, r = document) => r.querySelector(s);
  const sheet = $("#sheet"), scrim = $("#scrim"), shBody = $("#shBody"), shTitle = $("#shTitle"), toastEl = $("#toast");
  let toastTimer = 0, lastFocus = null;

  document.querySelectorAll(".js-ver").forEach(e => e.textContent = APP.version);
  document.querySelectorAll(".js-size").forEach(e => e.textContent = APP.size);
  const setLinks = root => root.querySelectorAll("a.js-dl").forEach(a => a.setAttribute("href", APP.apk || "#"));
  setLinks(document);

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("on"), 3600);
  }

  function openSheet(name) {
    const t = document.getElementById("t-" + name);
    if (!t) return;
    if (!sheet.classList.contains("on")) lastFocus = document.activeElement;
    shTitle.textContent = t.dataset.title;
    shBody.replaceChildren(t.content.cloneNode(true));
    setLinks(shBody);
    shBody.scrollTop = 0;
    sheet.classList.add("on"); scrim.classList.add("on");
    sheet.setAttribute("aria-hidden", "false");
    $("#shClose").focus();
  }
  function closeSheet() {
    sheet.classList.remove("on"); scrim.classList.remove("on");
    sheet.setAttribute("aria-hidden", "true");
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  async function download() {
    const url = APP.apk;
    if (!url) { toast("APK फ़ाइल जल्द उपलब्ध होगी।"); return; }
    const full = new URL(url, location.href);
    let ok = true;
    if (full.origin === location.origin) {
      try {
        const r = await fetch(full.href, { method: "HEAD", cache: "no-store" });
        if (!r.ok && r.status !== 405) ok = false;
      } catch (e) { ok = false; }
    }
    if (!ok) { toast("APK फ़ाइल अभी सर्वर पर नहीं है, जल्द उपलब्ध होगी।"); return; }
    const a = document.createElement("a");
    a.href = full.href; a.download = full.pathname.split("/").pop() || "app.apk";
    document.body.appendChild(a); a.click(); a.remove();
    toast("डाउनलोड शुरू हो रहा है… इंस्टॉल के लिए यूज़र गाइड देखें।");
  }

  document.addEventListener("click", e => {
    const dl = e.target.closest(".js-dl");
    if (dl) { e.preventDefault(); if (sheet.classList.contains("on")) closeSheet(); download(); return; }
    const op = e.target.closest("[data-open]");
    if (op) { e.preventDefault(); openSheet(op.dataset.open); }
  });
  $("#menuBtn").addEventListener("click", () => openSheet("menu"));
  $("#shClose").addEventListener("click", closeSheet);
  scrim.addEventListener("click", closeSheet);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && sheet.classList.contains("on")) closeSheet(); });
}
</script>
</body>
</html>
