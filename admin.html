<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Admin Panel | Job Portal</title><link rel="icon" href="img/favicon.png"><link rel="stylesheet" href="style.css?v=3">
<style>#app{padding:0 0 30px}form,.pad{padding:14px}label{display:block;font-weight:600;font-size:13px;margin:10px 0 3px}

.btn{background:#45106f;color:#fff;border-radius:8px;padding:10px 16px;font-weight:600;margin-top:12px}.btn.red{background:#b00020}.btn.gray{background:#666}
.item{border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:10px}.msg{padding:10px 14px;color:#b00020;font-weight:600}</style></head>
